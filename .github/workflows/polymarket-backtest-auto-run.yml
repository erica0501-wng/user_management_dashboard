name: Polymarket Daily Auto Backtests

on:
  schedule:
    # 13:00 UTC daily (≈ 06:00 PT / 21:00 HKT). Runs once per day.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      maxRuns:
        description: "Number of backtests to dispatch"
        required: false
        default: "12"
      strategies:
        description: "Comma-separated strategies (momentum, meanReversion, volatility)"
        required: false
        default: "momentum,meanReversion,volatility"
      groups:
        description: "Comma-separated market groups"
        required: false
        default: "NBA,Elon Tweets,Movies,Economic Policy"

jobs:
  trigger-auto-backtests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-backtest dispatcher
        env:
          # Full URL to the auto-run endpoint, e.g.
          #   https://<your-api-host>/polymarket/backtest/auto-run
          BACKTEST_TRIGGER_URL: ${{ secrets.BACKTEST_TRIGGER_URL }}
          # Reuses the same secret as the archive ingest workflow.
          ARCHIVE_TRIGGER_SECRET: ${{ secrets.ARCHIVE_TRIGGER_SECRET }}
          MAX_RUNS: ${{ github.event.inputs.maxRuns || '12' }}
          STRATEGIES: ${{ github.event.inputs.strategies || 'momentum,meanReversion,volatility' }}
          GROUPS: ${{ github.event.inputs.groups || 'NBA,Elon Tweets,Movies,Economic Policy' }}
        run: |
          if [ -z "$BACKTEST_TRIGGER_URL" ]; then
            echo "BACKTEST_TRIGGER_URL secret is not configured"
            exit 1
          fi

          if [ -z "$ARCHIVE_TRIGGER_SECRET" ]; then
            echo "ARCHIVE_TRIGGER_SECRET secret is not configured"
            exit 1
          fi

          payload=$(printf '{"maxRuns":%s,"strategies":"%s","groups":"%s"}' \
            "$MAX_RUNS" "$STRATEGIES" "$GROUPS")

          echo "Dispatching auto-backtest with payload: $payload"

          response=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ARCHIVE_TRIGGER_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${BACKTEST_TRIGGER_URL}")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP status: $status"
          echo "Response body: $body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
